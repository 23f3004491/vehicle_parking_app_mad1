{% extends "base.html" %}
{% block title %}Book Parking Spot{% endblock %}
{% block content %}
<div class="d-flex flex-column justify-content-center align-items-center min-vh-100">
    <div class="card shadow p-4" style="max-width: 400px; width: 100%;">
        <h4 class="mb-3">Book the Parking Spot</h4>
        <form method="POST" action="{{ url_for('book_parking_spot') }}">
            <div class="mb-3">
                <label class="form-label">Spot ID</label>
                <input type="text" class="form-control" name="spot_id" required>
            </div>
            <div class="mb-3">
                <label class="form-label">User ID</label>
                <input type="text" class="form-control" name="user_id" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Parking Start</label>
                <input type="datetime-local" class="form-control" name="parking_start" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Vehicle Number</label>
                <input type="text" class="form-control" name="vehicle_number" required>
            </div>
            <button type="submit" class="btn btn-success">Reserve</button>
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancel</button>
        </form>
    </div>
</div>
{% endblock %}
